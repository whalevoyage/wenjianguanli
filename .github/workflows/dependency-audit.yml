name: Dependency Audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  python:
    name: Python dependency audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit contributor and CI lock
        run: pip-audit --strict --requirement requirements.lock

      - name: Audit Windows release lock
        run: pip-audit --strict --requirement packaging/requirements-release.lock

  frontend:
    name: npm dependency audit
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked npm dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev

      - name: Audit complete build dependency tree
        working-directory: frontend
        run: npm audit
