name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_history:
        description: Scan every commit in Git history (takes longer)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current tree
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_history }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Checkout full history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_history }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan checked-out source
        if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_history }}
        run: gitleaks dir --no-banner --redact --exit-code 1 .

      - name: Scan full Git history
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_history }}
        run: gitleaks git --no-banner --redact --exit-code 1 .
