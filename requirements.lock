# 依赖锁 —— 用于「可复现安装」
#
# 为什么需要它：`requirements.txt` 用的是 `>=` 宽松约束，同一份代码在不同时间、
# 不同机器上装出来的版本可能不一样。2026-10-17 的项目体检就吃过这类亏：
# 发行包落后源码 19 个提交，而文档里的测试数停在 73 项（实际 106）——
# 没有一个可复现的基线，「我这儿能跑」就没有说服力。
#
# 用法：
#   pip install -r requirements.lock     # 精确复现
#   pip install -r requirements.txt      # 只看要求，交给 pip 自己解析
#
# ★ 不要用 `pip freeze` 生成这个文件：开发机上有 145 个包（aider、aiohttp…），
#   freeze 会把与本项目无关的全部写进来。这里只列项目真正的依赖树。
#
# 基线环境：Windows 11 / CPython 3.12 / 2026-10-18

