[project]
name = "atlas-filepilot"
version = "2.0.0"
description = "本地文件管理台：扫描 / 查重 / 清理 / 跨盘迁移 / 空间地图 + Agent 助手（除助手页外零 token、纯本地）"
requires-python = ">=3.11"

# 运行必需：只有这两个。
# 其余全部可选 —— 不装也能跑，只是对应功能不可用（会在界面上如实说明缺什么）。
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
# 桌面窗口（WebView2）。不装就退回浏览器打开，功能一样。
desktop = ["pywebview"]
# 相似图片查重（感知哈希）。不装时「找出相似图片」会明确提示缺 Pillow。
images = ["pillow"]
# 打包发行版
packaging = ["pyinstaller"]
# 测试只用标准库（unittest），所以这里是空的 —— 不需要 pytest
test = []

[project.scripts]
atlas = "packaging.launcher:main"
atlas-mcp = "backend.mcp_server:serve_main"
atlas-cli = "backend.cli:main"

[tool.ruff]
line-length = 120
target-version = "py311"
