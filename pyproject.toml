[project]
name = "atlas-filepilot"
version = "2.1.0"
description = "本地优先、安全可控的 Windows 文件管理与磁盘整理工具，提供预览确认、可追溯操作、受支持的回滚和 AI Agent"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "王鑫焱 (wangxinyan)" }]

# 运行必需：只有这两个。
# 其余全部可选 —— 不装也能跑，只是对应功能不可用（会在界面上如实说明缺什么）。
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
# 桌面窗口（WebView2）。不装就退回浏览器打开，功能一样。
desktop = ["pywebview"]
# 相似图片查重（感知哈希）。不装时「找出相似图片」会明确提示缺 Pillow。
images = ["pillow"]
# 打包发行版
packaging = ["pyinstaller"]
# 部分测试用 pytest（pytest.raises / tmp_path 等），所以这里声明 pytest；
# 想跑测试：`pip install -e .[test]` 后 `python -m pytest tests/ -q`（仅收 test_*.py）。
# httpx 是 FastAPI TestClient 的依赖 —— 少了它，凡是走 HTTP 路由的测试会直接 import 失败。
test = ["pytest", "httpx"]

[project.scripts]
atlas = "atlas_app.launcher:main"
atlas-mcp = "backend.mcp_server:serve_main"
atlas-cli = "backend.cli:main"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_app*", "backend*"]
namespaces = false

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
# 只把 `test_*.py` 当单元测试收集；`*_test.py`（smoke_test / messagebox_style_test / …）
# 是必须起服务器或浏览器的手动脚本，不要让 pytest 在收集阶段就崩。
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
addopts = "-q"
